name: recomputer_j401
platform: linux
adapter: jetson
capabilities:
  usb: linux_generic
  storage: linux_generic
  network: linux_generic
  pcie_nvme: linux_generic
  rtc: linux_generic
  fan: linux_generic
  gpio: linux_generic
  i2c: linux_generic
  spi: linux_generic
  camera: linux_generic
  wifi: linux_generic
  bluetooth: linux_generic
  display: linux_generic
  uart: linux_generic
  system_info: jetson
interfaces:
  usb:
    items:
      - usb_host_0
      - usb_host_1
  storage:
    items:
      - /dev/sda
  network:
    items:
      - gigabit_ethernet
  pcie_nvme:
    items:
      - m2_key_m
  rtc:
    items:
      - /dev/rtc0
  fan:
    items:
      - pwm_fan
  gpio:
    items:
      - 40pin_header
  i2c:
    items:
      - 40pin_header_i2c
  spi:
    items:
      - 40pin_header_spi0
      - 40pin_header_spi3
  camera:
    items:
      - csi_0
      - csi_1
  wifi:
    items:
      - m2_key_e_wifi
  bluetooth:
    items:
      - m2_key_e_bluetooth
  display:
    items:
      - hdmi
  uart:
    items:
      - 40pin_header_uart
tools_required:
  - lsusb
  - lsblk
  - findmnt
  - dd
  - hdparm
  - ip
  - ping
  - hwclock
  - i2cdetect
  - python3-spidev
  - gst-launch-1.0
  - gst-inspect-1.0
  - iw
  - bluetoothctl
  - xrandr
metadata:
  vendor: Seeed
  family: Jetson
  first_supported_suite: usb_smoke
