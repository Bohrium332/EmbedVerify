[project]
name = "hardware-interface-verify"
version = "0.1.0"
description = "Platform-neutral hardware interface verification MVP."
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
ev = "embedverify.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

