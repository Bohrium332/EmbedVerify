name: usb_host_storage
description: USB Host enumeration and mounted USB storage speed smoke test.
module: usb
execution: sequential
functions:
  - name: usb.detect
    label: usb_detect
    save_output: true
    params:
      bus_type: any
      expected_count: 1
    expect:
      pass_policy: all
      rules:
        - field: code
          operator: eq
          value: 0
          message: USB device must be detected

  - name: storage.info
    label: storage_info
    skip_on_fail: true
    save_output: true
    params: {}
    expect:
      pass_policy: all
      rules:
        - field: code
          operator: eq
          value: 0
          message: Storage info command must succeed
        - field: metrics.device_count
          operator: gt
          value: 0
          message: Storage device information must be available

  - name: storage.read_speed
    label: storage_read_speed
    skip_on_fail: true
    save_output: true
    params:
      device: "{{ storage_info.result.details.discovery.disk }}"
      min_speed_mbps: 0
    expect:
      pass_policy: all
      rules:
        - field: code
          operator: eq
          value: 0
          message: USB storage read speed command must succeed
        - field: metrics.read_speed_mbps
          operator: gt
          value: 0
          message: USB storage read speed must be positive

  - name: storage.write_speed
    label: storage_write_speed
    skip_on_fail: true
    save_output: true
    params:
      mount_point: auto
      file_size_mb: 256
      min_speed_mbps: 0
    expect:
      pass_policy: all
      rules:
        - field: code
          operator: eq
          value: 0
          message: USB storage write speed command must succeed
        - field: metrics.write_speed_mbps
          operator: gt
          value: 0
          message: USB storage write speed must be positive
