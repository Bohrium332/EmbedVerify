name: csi_camera
description: CSI camera Argus detection and one-frame capture smoke test.
module: camera
execution: sequential
functions:
  - name: camera.detect
    label: camera_detect
    save_output: true
    params:
      sensor_id: 0
      probe_capture: false
      timeout: 12
    expect:
      pass_policy: all
      rules:
        - field: code
          operator: eq
          value: 0
          message: CSI camera must be available through Argus
        - field: metrics.plugin_available
          operator: eq
          value: true
          message: NvArgus camera plugin must be available
        - field: metrics.video_device_count
          operator: gt
          value: 0
          message: CSI video device node must exist

  - name: camera.capture_smoke
    label: camera_capture
    skip_on_fail: true
    save_output: true
    params:
      sensor_id: 0
      width: 1280
      height: 720
      framerate: 30
      timeout: 12
    expect:
      pass_policy: all
      rules:
        - field: code
          operator: eq
          value: 0
          message: CSI one-frame capture must succeed
        - field: metrics.capture_ok
          operator: eq
          value: true
          message: CSI capture metric must be true
